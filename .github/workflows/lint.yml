name: Lint code

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: ruff findings are reported, never written back, so this
# needs no write access to the repository — only the right to leave a comment.
# (Previously: contents: write, to push the auto-fixes.)
permissions:
  contents: read

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    # Actions are pinned by commit SHA (not a mutable tag) so a compromised or
    # retagged upstream cannot inject code into this job — cf. the tj-actions
    # incident (CVE-2025-30066).
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.x"

    - name: Install ruff
      run: |
        python3 -m pip install ruff

    # pyproject sets fix = true, so a bare `ruff check` would rewrite the files
    # and exit 0 — reporting needs --no-fix, and the formatter needs --diff.
    # Both steps keep going so one comment can carry every finding.
    - name: Check formatting
      id: fmt
      continue-on-error: true
      run: |
        set -o pipefail
        ruff format --diff | tee "$RUNNER_TEMP/fmt.txt"

    - name: Lint
      id: lint
      continue-on-error: true
      run: |
        set -o pipefail
        ruff check --no-fix | tee "$RUNNER_TEMP/lint.txt"

    - name: Comment on the pull request
      if: >-
        github.event_name == 'pull_request' &&
        (steps.fmt.outcome == 'failure' || steps.lint.outcome == 'failure')
      env:
        # Passed through the environment rather than interpolated into the
        # script, so nothing here can be read as shell.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        LINT_OUTCOME: ${{ steps.lint.outcome }}
      run: |
        {
          echo "### Ruff нашёл замечания"
          echo
          if [ "$FMT_OUTCOME" = "failure" ]; then
            echo "<details><summary><b>ruff format</b> — требуется переформатирование</summary>"
            echo
            echo '```diff'
            head -c 25000 "$RUNNER_TEMP/fmt.txt"
            echo '```'
            echo
            echo "</details>"
            echo
          fi
          if [ "$LINT_OUTCOME" = "failure" ]; then
            echo "<details><summary><b>ruff check</b> — нарушения правил</summary>"
            echo
            echo '```'
            head -c 25000 "$RUNNER_TEMP/lint.txt"
            echo '```'
            echo
            echo "</details>"
            echo
          fi
          echo "Чинится локально: \`ruff format && ruff check --fix\`"
        } > "$RUNNER_TEMP/comment.md"

        gh pr comment "$PR_NUMBER" \
          --repo "$GITHUB_REPOSITORY" \
          --body-file "$RUNNER_TEMP/comment.md"

    - name: Fail if ruff reported anything
      if: steps.fmt.outcome == 'failure' || steps.lint.outcome == 'failure'
      run: |
        echo "Ruff reported issues - see the job log above."
        exit 1
