name: Lint code

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: ruff findings are reported, never written back, so this
# needs no write access to the repository — only the right to leave a comment.
# (Previously: contents: write, to push the auto-fixes.)
permissions:
  contents: read

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
    # Actions are pinned by commit SHA (not a mutable tag) so a compromised or
    # retagged upstream cannot inject code into this job — cf. the tj-actions
    # incident (CVE-2025-30066).
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.x"

    - name: Install ruff
      run: |
        python3 -m pip install ruff

    # pyproject sets fix = true, so a bare `ruff check` would rewrite the files
    # and exit 0 — reporting needs --no-fix, and the formatter needs --diff.
    # Both steps keep going so one report can carry every finding, and both
    # capture stderr: ruff exits 2 with the reason there (unreadable file, bad
    # config) and the report would otherwise show an empty block.
    - name: Check formatting
      id: fmt
      continue-on-error: true
      run: |
        set +e
        ruff format --diff > "$RUNNER_TEMP/fmt.txt" 2>&1
        code=$?
        cat "$RUNNER_TEMP/fmt.txt"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Lint
      id: lint
      continue-on-error: true
      run: |
        set +e
        ruff check --no-fix > "$RUNNER_TEMP/lint.txt" 2>&1
        code=$?
        cat "$RUNNER_TEMP/lint.txt"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"

    # Runs on clean builds too, to retract a report left by an earlier push.
    # A pull request opened from a fork gets a read-only GITHUB_TOKEN, so this
    # cannot comment there no matter what permissions are declared; that is a
    # missing convenience, not a missing signal, hence continue-on-error — the
    # findings stay in the job log and the final step still fails the run.
    - name: Report ruff findings on the pull request
      if: github.event_name == 'pull_request'
      continue-on-error: true
      env:
        # Passed through the environment rather than interpolated into the
        # script, so nothing here can be read as shell.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        LINT_OUTCOME: ${{ steps.lint.outcome }}
        FMT_CODE: ${{ steps.fmt.outputs.code }}
        LINT_CODE: ${{ steps.lint.outputs.code }}
        MARKER: "<!-- ruff-report -->"
      run: |
        set -euo pipefail

        # One report per pull request: find the one this job left earlier so it
        # can be rewritten or retracted instead of stacking up a new comment on
        # every push.
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          --paginate \
          --jq "map(select(.body | startswith(\"$MARKER\"))) | .[-1].id // empty")

        if [ "$FMT_OUTCOME" != "failure" ] && [ "$LINT_OUTCOME" != "failure" ]; then
          if [ -n "$existing" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$existing"
            echo "Ruff is clean again - retracted the earlier report."
          fi
          exit 0
        fi

        section() {  # title, file, fence, exit code
          if [ "$4" = "2" ]; then
            echo "<details open><summary><b>$1</b> — ruff завершился с ошибкой (exit 2)</summary>"
          else
            echo "<details><summary><b>$1</b></summary>"
          fi
          echo
          echo "\`\`\`$3"
          head -c 25000 "$2"
          # head -c can stop mid-line; force a newline so the closing fence is
          # not appended to the last truncated line.
          echo
          echo "\`\`\`"
          echo
          echo "</details>"
          echo
        }

        {
          printf '%s\n' "$MARKER"
          echo "### Ruff нашёл замечания"
          echo
          if [ "$FMT_OUTCOME" = "failure" ]; then
            section "ruff format — требуется переформатирование" \
              "$RUNNER_TEMP/fmt.txt" diff "$FMT_CODE"
          fi
          if [ "$LINT_OUTCOME" = "failure" ]; then
            section "ruff check — нарушения правил" \
              "$RUNNER_TEMP/lint.txt" "" "$LINT_CODE"
          fi
          echo "Чинится локально: \`ruff format && ruff check --fix\`"
        } > "$RUNNER_TEMP/body.md"

        jq -Rs '{body: .}' < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/payload.json"

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
            --input "$RUNNER_TEMP/payload.json"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --input "$RUNNER_TEMP/payload.json"
        fi

    - name: Fail if ruff reported anything
      if: steps.fmt.outcome == 'failure' || steps.lint.outcome == 'failure'
      run: |
        echo "Ruff reported issues - see the job log above."
        exit 1
